[package]
name = "vegam-iroh-blobs-spike"
version = "0.1.0"
edition = "2021"
rust-version = "1.91"
publish = false
description = "Phase 2 production spike: prove iroh 1.0-rc + iroh-blobs meet the Vegam desktop v1 transfer bar (ADR 0021)"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
hex = "0.4"
iroh = "=1.0.0-rc.1"
iroh-blobs = "0.102"
n0-future = "0.3"
tokio = { version = "1", features = ["full"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
debug = true
