[package]
name = "vegam"
version = "0.1.0"
description = "Vegam desktop file transfer"
authors = ["Mohammed Imran"]
edition = "2021"
# Floor set by the Iroh 1.0-generation crates.
rust-version = "1.91"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "vegam_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
hex = "0.4"
iroh = "=1.0.0"
iroh-blobs = "0.103"
iroh-tickets = "=1.0.0"
# Same line iroh-blobs 0.103 uses; needed for the provider event channel types.
irpc = "0.17"
log = "0.4"
n0-future = "0.3"
postcard = { version = "1", features = ["use-std"] }
rand = "0.9"
# Only used by the opt-in PostHog telemetry path; already in the tree via iroh.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
tokio = { version = "1", features = ["full"] }
# The "log" feature deliberately bridges tracing events into the `log`
# records that tauri-plugin-log persists.
tracing = { version = "0.1", features = ["log"] }
uuid = { version = "1", features = ["v4", "serde"] }
