[package]
name = "vegam"
version = "0.1.0"
description = "Vegam desktop file transfer"
authors = ["Mohammed Imran"]
edition = "2021"
# Floor set by the Iroh 1.0-generation crates (rust-version 1.91)
rust-version = "1.91"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "vegam_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
hex = "0.4"
iroh = "=1.0.0-rc.1"
iroh-blobs = "0.102"
iroh-tickets = "=1.0.0-rc.1"
# Same line iroh-blobs 0.102 uses; needed for the provider event channel types.
irpc = "0.16"
log = "0.4"
n0-future = "0.3"
postcard = { version = "1", features = ["use-std"] }
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
# time >= 0.3.48 breaks the build of rcgen 0.14.8 (transitive via iroh).
# See spikes/iroh-blobs/README.md. Remove the pin when upstream fixes land.
time = "=0.3.47"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
